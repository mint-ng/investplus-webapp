# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go
name: Deploy to Prod Env
on:
  push:
    branches: [ "production-main" ]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_KEY: ${{ secrets.DOCKERHUB_TOKEN }}
  IMAGE_NAME: ncto-beneficiary-portal
  MANIFEST_DIR: apps/mintyn-prod
  RUN_NUMBER: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:prod-app-${{ github.run_number }}
          file: Dockerfile-main
          build-args: |
            APP_STAGE=prod
            API_BASE_URL=https://api.mintfintech.com/card-service
            CLIENT_KEY=${{ secrets.API_LIVE_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        name: deploying application with new image tag
        with:
          repository: 'mint-ng/argocd'
          token: ${{ secrets.GIT_TOKEN }}
          ref: main
      - name: update image
        run: |
          cd ${{ env.MANIFEST_DIR }}
          sed -i "s|${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}.*|${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:prod-app-${{ github.run_number }}|g" ncto-beneficiary-portal-values.yaml  
          git config user.email tech@mintfintech.com
          git config user.name mint-ng
          git add ncto-beneficiary-portal-values.yaml
          git diff --staged  # Debugging: printing the changes to be committed
          git commit -m "Done by Github Actions Job change manifest: ${{ github.run_number }}"
          git push origin main 
