# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Deploy to Sandbox Env
on:
  push:
    branches: ["sandbox"]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_KEY: ${{ secrets.DOCKERHUB_TOKEN }}
  IMAGE_NAME: investplus-app
  MANIFEST_DIR: apps/mintyn-sandbox
  RUN_NUMBER: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:app-${{ github.run_number }}
          file: Dockerfile-main
          build-args: |
            APP_STAGE=dev
            API_BASE_URL=https://api-sandbox.mintfintech.com
            CLIENT_KEY=bWludC13ZWItY2xpZW50LWtleS0wMDEwMDE=

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        name: deploying application with new image tag
        with:
          repository: "mint-ng/argocd"
          token: ${{ secrets.GIT_TOKEN }}
          ref: main
      - name: update image
        run: |
          cd ${{ env.MANIFEST_DIR }}
          sed -i "s|${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}.*|${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:app-${{ github.run_number }}|g" investplus-app-values.yaml  
          git config user.email tech@mintfintech.com
          git config user.name mint-ng
          git add investplus-app-values.yaml 
          git diff --staged  # Debugging: printing the changes to be committed
          git commit -m "Done by Github Actions Job change manifest: ${{ github.run_number }}"
          git push origin main
